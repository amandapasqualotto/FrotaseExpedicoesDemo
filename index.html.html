const recalc = id => {
  if (!id || !D.veiculos[id]) return;
  const man = Object.values(D.manutencoes || {}).some(m => m.idVeiculo === id && m.statusManutencao === 'Aberta');
  const ex = Object.values(D.expedicoes || {}).some(x => x.idVeiculo === id && x.statusExpedicao === 'Em rota');
  D.veiculos[id].status = man ? 'Manutenção' : ex ? 'Em uso' : 'Disponível';
};

const salvar = (col, id, v) => {
  const old = id ? D[col][id] : null;
  const key = id || `${col.slice(0, 3)}_${Date.now()}`;
  
  if (col === 'inspecoes') {
    const a = IN.map(k => v[k]);
    v.qtdAtencao = a.filter(x => x === 'Atenção').length;
    v.qtdCritico = a.filter(x => x === 'Crítico').length;
  }
  if (col === 'abastecimentos') {
    const l = Number(v.litros || 0), val = Number(v.valor || 0);
    v.cotacao = l > 0 ? Number((val / l).toFixed(2)) : 0;
    const odo = Number(v.odometro);
    const cf = Object.entries(D.abastecimentos || {}).find(([i, a]) => i !== id && a.idVeiculo === v.idVeiculo && temOdo(a) && ((a.data < v.data && Number(a.odometro) > odo) || (a.data > v.data && Number(a.odometro) < odo)));
    if (cf) throw new Error(`Odômetro inconsistente com o abastecimento de ${dt(cf[1].data)} (${Number(cf[1].odometro).toLocaleString('pt-BR')} km).`);
  }
  if (col === 'expedicoes' && v.kmChegada !== undefined) {
    if (v.kmChegada < v.kmSaida) throw new Error('Quilometragem inválida.');
    v.kmRodado = v.kmChegada - v.kmSaida;
  }
  if (!old) v.criadoEm = Date.now();
  if (col === 'veiculos' && !old) v.status = 'Disponível';
  
  D[col][key] = v;
  
  if (col === 'manutencoes' || col === 'expedicoes') {
    recalc(v.idVeiculo);
    if (old && old.idVeiculo !== v.idVeiculo) recalc(old.idVeiculo);
  }
  
  saveDB();
  toast(col === 'expedicoes' ? 'Expedição atualizada.' : 'Registro salvo.');
};

const novaExp = () => form('expedicoes', null, ['idMotorista', 'idRota', 'idVeiculo', 'kmSaida', 'observacoesSaida'], 'Nova expedição', v => {
  if (D.motoristas[v.idMotorista]?.status !== 'Ativo') throw new Error('Motorista inativo.');
  if (D.veiculos[v.idVeiculo]?.status !== 'Disponível') throw new Error('Veículo indisponível.');
  
  D.veiculos[v.idVeiculo].status = 'Em uso';
  const t = Date.now();
  const key = `exp_${t}`;
  D.expedicoes[key] = { ...v, criadoEm: t, dataHoraSaida: t, statusExpedicao: 'Em rota' };
  saveDB();
  toast('Expedição criada.');
}, { disp: 1 });

const fim = id => {
  const e = D.expedicoes[id];
  form('expedicoes', id, ['kmChegada', 'observacoesRetorno'], 'Finalizar expedição', v => {
    if (v.kmChegada < e.kmSaida) throw new Error('Quilometragem inválida.');
    D.expedicoes[id] = { ...e, ...v, kmRodado: v.kmChegada - e.kmSaida, dataHoraChegada: Date.now(), statusExpedicao: 'Finalizada' };
    recalc(e.idVeiculo);
    saveDB();
    toast('Expedição finalizada.');
  });
};

/* FORMULÁRIO GENÉRICO */
const inp = ([k, l, t = 'text', o], v, ctx) => {
  if (t === 'sel') return `<select name="${k}" class="${IC}"><option value=""></option>${o.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  if (t === 'chk_dias') {
    const sel = Array.isArray(v) ? v : (v ? String(v).split(', ') : []);
    return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 border border-linha rounded-lg p-3 bg-white">${DIAS.map(d => `<label class="inline-flex items-center gap-1.5 text-xs text-gray-700 cursor-pointer"><input type="checkbox" name="${k}" value="${d}" ${sel.includes(d) ? 'checked' : ''} class="rounded border-gray-300 text-brand focus:ring-brand"> ${d}</label>`).join('')}</div>`;
  }
  if (t === 'chk_lojas') {
    const lojasList = Object.entries(D.lojas || {}).sort(porNome);
    if (!lojasList.length) return `<div class="text-xs text-gray-500 italic">Cadastre lojas primeiro.</div>`;
    PERC = (Array.isArray(v) ? v : (v ? String(v).split(', ') : [])).filter(id => D.lojas[id]);
    return `<input id="lq" type="search" placeholder="Pesquisar loja por nome ou cidade..." class="${IC} mb-2" autocomplete="off">
<div id="lojasBox" class="grid grid-cols-1 sm:grid-cols-2 gap-2 border border-linha rounded-lg p-3 bg-white max-h-40 overflow-y-auto">${lojasList.map(([id, r]) => `<label data-n="${esc(norm(r.nomeLoja + ' ' + r.cidade))}" class="inline-flex items-center gap-1.5 text-xs text-gray-700 cursor-pointer"><input type="checkbox" name="${k}" value="${id}" data-perc ${PERC.includes(id) ? 'checked' : ''} class="rounded border-gray-300 text-brand focus:ring-brand"> ${esc(r.nomeLoja)} (${esc(r.cidade)})</label>`).join('')}<div id="lojasVazio" class="hidden text-xs text-gray-400 italic">Nenhuma loja encontrada.</div></div>
<div class="mt-3"><span class="block mb-1.5 font-medium text-grafite">Percurso (ordem de visita)</span><ol id="perc" class="space-y-1 bg-gray-50 border border-gray-200 rounded-xl p-2">${percHtml()}</ol></div>`;
  }
  if (t === 'file') return `<input name="${k}_file" id="${k}_file" type="file" accept="image/*" class="${IC}"><input type="hidden" name="${k}" value="${esc(v)}">${v ? `<div class="mt-1 text-xs text-green-700 font-medium">✓ Imagem já anexada</div>` : ''}`;
  if (t.startsWith('ref:')) {
    const cn = t.slice(4);
    return `<select name="${k}" class="${IC}"><option value=""></option>${Object.entries(D[cn] || {}).filter(([i, r]) => !(ctx.disp && cn === 'veiculos' && r.status !== 'Disponível') && (ctx.todos || !(cn === 'motoristas' && r.status === 'Inativo' && i !== v))).map(([i, r]) => `<option value="${i}" ${i === v ? 'selected' : ''}>${esc(LAB[cn](r))}</option>`).join('')}</select>`;
  }
  if (t === 'url') return `<input name="${k}" type="url" placeholder="https://maps.app.goo.gl/..." value="${esc(v)}" class="${IC}">`;
  if (t === 'textarea') return `<textarea name="${k}" rows="2" class="${IC}">${esc(v)}</textarea>`;
  return `<input name="${k}" type="${t}" ${t === 'number' ? 'step="any"' : ''} value="${esc(v ?? (t === 'datetime-local' ? agora() : ''))}" class="${IC}">`;
};

const form = (col, id, keys, title, onSave, ctx = {}) => {
  const rec = id ? D[col][id] : {}, fs = keys.map(k => fl(col, k));
  modal(`<h3 class="font-display text-2xl font-semibold tracking-tight mb-5">${title}</h3><form id="fm" class="grid sm:grid-cols-2 gap-3">${fs.map(f => { const tg = ['chk_dias', 'chk_lojas'].includes(f[2]) ? 'div' : 'label'; return `<${tg} class="text-sm ${['textarea', 'chk_dias', 'chk_lojas'].includes(f[2]) ? 'sm:col-span-2' : ''}"><span class="block mb-1.5 font-medium text-grafite">${f[1]}</span>${inp(f, rec[f[0]], ctx)}</${tg}>`; }).join('')}<div class="sm:col-span-2 flex justify-end gap-2 pt-2"><button type="button" class="${G}" data-a="x">Cancelar</button><button class="${B}">Salvar</button></div></form>`);
  
  $('#fm').onsubmit = async e => {
    e.preventDefault();
    const v = {};
    for (const f of fs) {
      const k = f[0];
      if (f[2] === 'chk_lojas') {
        if (!PERC.length) return toast(`Selecione ao menos um item de ${f[1]}.`, 0);
        v[k] = PERC.join(', ');
        continue;
      }
      if (f[2] === 'chk_dias') {
        const cks = Array.from(e.target.querySelectorAll(`input[name="${k}"]:checked`)).map(c => c.value);
        if (!cks.length) return toast(`Selecione ao menos um item de ${f[1]}.`, 0);
        v[k] = cks.join(', ');
        continue;
      }
      if (f[2] === 'file') {
        const fi = e.target[`${k}_file`]?.files[0];
        if (fi) {
          v[k] = await new Promise(res => {
            const r = new FileReader();
            r.onload = ev => res(ev.target.result);
            r.readAsDataURL(fi);
          });
        } else {
          v[k] = rec[k] || '';
        }
        continue;
      }
      let x = e.target[k]?.value?.trim() ?? '';
      if (x === '' && f[2] !== 'textarea' && !f[4]) return toast('Preencha o campo: ' + f[1], 0);
      if (f[2] === 'url' && x !== '' && !/^https?:\/\//i.test(x)) return toast('Link inválido: use um endereço que comece com http.', 0);
      if (f[2] === 'number' && x !== '') {
        x = Number(x);
        if (isNaN(x) || x < 0) return toast(/^km|odometro/.test(k) ? 'Quilometragem inválida.' : 'Valor inválido.', 0);
      }
      v[k] = x;
    }
    try {
      (onSave || (val => salvar(col, id, val)))(v, id);
      modal();
    } catch (er) {
      toast(er.message || 'Erro ao salvar.', 0);
    }
  };
};

const conf = (msg, fn, ok = 'Registro excluído.') => {

  $('#ok').onclick = () => {

/* TABELAS E FORMATAÇÕES */
const fmt = (col, r, k, id) => {
  const v = r[k], f = fl(col, k);
  if (k === 'id') return esc(id.slice(-6));
  if (k === 'checklist') {
    return `<button class="text-brand font-medium underline underline-offset-2 inline-flex items-center gap-1 whitespace-nowrap" data-a="chkexp" data-i="${id}">${svg('clip', 'w-3.5 h-3.5')} Checklist (Ver mais)</button>`;
  }
  if (k === 'fotoNota') {
    return v ? `<button class="text-brand font-medium underline underline-offset-2" data-a="verfoto" data-i="${id}">Ver Foto</button>` : '—';
  }
  if (k === 'idLojas' && v) {
    const ids = String(v).split(', ');
    return esc(ids.map(idLoja => D.lojas?.[idLoja]?.nomeLoja || '').filter(Boolean).join(' → ') || v);
  }
  if (k === 'linkMaps') return /^https?:\/\//i.test(v || '') ? `<a href="${esc(v)}" target="_blank" rel="noopener" class="text-brand font-medium underline underline-offset-2 whitespace-nowrap hover:text-brand-dark">Abrir no Maps</a>` : '—';
  if (k === 'kmEstimado' || k === 'odometro') return v !== undefined && v !== '' && v !== null ? Number(v).toLocaleString('pt-BR') + ' km' : '—';
  if (k === 'dataHoraSaida' || k === 'dataHoraChegada') return v ? new Date(v).toLocaleString('pt-BR') : '—';
  if ((f[2] || '').startsWith('ref:')) return esc(nm(f[2].slice(4), v));
  if (k === 'validadeCnh' && v) {
    const d = Math.ceil((new Date(v) - new Date().setHours(0,0,0,0)) / 864e5);
    return dt(v) + ' ' + (d < 0 ? badge('Crítico', 'Vencida') : d <= 30 ? badge('Atenção', 'Vence em ' + d + 'd') : '');
  }
  if (f[2] === 'date') return dt(v);
  if (k === 'dataHora' && v) return new Date(v).toLocaleString('pt-BR');
  if (k === 'litros') return v !== undefined && v !== '' ? Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' L' : '—';
  if (k === 'valor') return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  if (k === 'cotacao') return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  if (k === 'qtdAtencao') return v ? badge('Atenção', v) : '0';
  if (k === 'qtdCritico') return v ? badge('Crítico', v) : '0';
  if (BC[v]) return badge(v);
  return esc(v ?? '—');
};

const stK = col => ['status', 'statusManutencao', 'statusExpedicao'].find(k => E[col].c.includes(k));

const corpo = col => {
  const q = (F[col + 'q'] || '').toLowerCase(), s = F[col + 's'] || '', sk = stK(col);
  const rows = Object.entries(D[col] || {}).sort((a, b) => col === 'lojas' ? porNome(a, b) : (b[1].criadoEm || b[1].dataHoraSaida || 0) - (a[1].criadoEm || a[1].dataHoraSaida || 0)).filter(([i, r]) => (!s || r[sk] === s) && E[col].c.map(k => fmt(col, r, k, i)).join(' ').replace(/<[^>]+>/g, '').toLowerCase().includes(q));
  if (!rows.length) return `<tr><td colspan="10" class="p-6 text-center text-gray-400">Nenhum registro encontrado.</td></tr>`;
  
  return rows.map(([i, r]) => {
    const tone = col === 'inspecoes' ? (r.qtdCritico ? 'bg-red-50/60' : r.qtdAtencao ? 'bg-amber-50/60' : '') : '';
    const mainRow = `<tr class="border-t border-gray-100 hover:bg-gray-50/80 ${tone}">${E[col].c.map(k => `<td class="px-4 py-3">${fmt(col, r, k, i)}</td>`).join('')}<td class="px-4 py-3 whitespace-nowrap text-right">${col === 'expedicoes' && r.statusExpedicao === 'Em rota' ? `<button class="font-semibold text-brand hover:text-brand-dark mr-3" data-a="fim" data-i="${i}">Finalizar</button>` : ''}<button class="font-medium text-ink hover:text-brand mr-3" data-a="edit" data-c="${col}" data-i="${i}">Editar</button><button class="font-medium text-red-600 hover:text-red-700" data-a="del" data-c="${col}" data-i="${i}">Excluir</button></td></tr>`;
    
    if (col === 'inspecoes') {
      const chkItems = IN.map(k => `<div class="flex justify-between items-center text-xs border-b py-1"><span class="text-gray-600">${hum(k)}</span><span>${badge(r[k] || 'OK')}</span></div>`).join('');
      const expRow = `<tr id="chk_${i}" class="hidden bg-gray-50/80"><td colspan="${E[col].c.length + 1}" class="p-4 border-b"><div class="bg-white border rounded-xl p-4 max-w-2xl shadow-sm"><div class="font-semibold text-sm text-ink mb-2">Checklist de Inspeção do Veículo</div><div class="grid sm:grid-cols-2 gap-x-6 gap-y-1">${chkItems}</div></div></td></tr>`;
      return mainRow + expRow;
    }
    return mainRow;
  }).join('');
};

const bars = (o, cor = {}) => {
  const m = Math.max(1, ...Object.values(o));
  return Object.entries(o).map(([k, v]) => `<div class="flex items-center gap-3 text-[13px] mb-2.5 last:mb-0"><span class="w-36 truncate text-grafite" title="${esc(k)}">${esc(k)}</span><div class="flex-1 bg-gray-100 rounded-full h-2"><div class="${cor[k] || 'bg-brand'} h-2 rounded-full" style="width:${v / m * 100}%"></div></div><span class="w-16 text-right num font-semibold">${Number(v).toLocaleString('pt-BR')}</span></div>`).join('') || '<p class="text-sm text-gray-400">Sem dados no período.</p>';
};

const ci = l => /KM/i.test(l) ? 'gauge' : /Expedi/.test(l) ? 'pkg' : /uso/.test(l) ? 'truck' : /dispon/.test(l) ? 'check' : /manuten/i.test(l) ? 'wrench' : /Motorista/.test(l) ? 'user' : /crític/.test(l) ? 'alert' : /gasto/i.test(l) ? 'dollar' : /abastec|litro/i.test(l) ? 'fuel' : 'grid';
const card = (l, v) => `<div class="bg-white border border-linha rounded-xl p-5"><div class="flex items-center gap-2 text-sm text-grafite font-medium"><span class="text-brand">${svg(ci(l), 'w-4 h-4')}</span>${l}</div><div class="font-display text-3xl font-semibold tracking-tight mt-2 num">${v}</div></div>`;

const lista = col => {

  }

    extra = `<div class="grid sm:grid-cols-3 gap-3 mb-5">${card('Total gasto com combustíveis', 'R$ ' + totValor.toLocaleString('pt-BR', { minimumFractionDigits: 2 }))}${card('Total de litros', totLitros.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) + ' L')}${card('Abastecimentos', abs.length)}</div>`;

  return `<div class="flex flex-wrap gap-4 items-end justify-between mb-6"><div><h2 class="font-display text-[34px] leading-tight font-semibold tracking-tight">${E1.t}</h2><p class="text-grafite">${(n => n + (n === 1 ? ' registro' : ' registros'))(Object.keys(D[col] || {}).length)}</p></div><div class="flex flex-wrap gap-2">${col === 'abastecimentos' ? `<button class="${G}" data-a="consumo">${svg('gauge', 'w-4 h-4')} Média de consumo</button>` : ''}<button class="${G}" data-a="rel" data-c="${col}">${svg('clip', 'w-4 h-4')} Gerar relatório</button><button class="${B}" data-a="new" data-c="${col}">${E1.n}</button></div></div>${extra}
<div class="flex flex-wrap gap-2 mb-3"><input id="q" placeholder="Pesquisar em ${E1.t.toLowerCase()}" value="${esc(F[col + 'q'] || '')}" class="${IC} max-w-xs">${sk ? `<select id="s" class="${IC} max-w-[11rem]"><option value="">Todos os status</option>${vals.map(x => `<option ${x === F[col + 's'] ? 'selected' : ''}>${x}</option>`).join('')}</select>` : ''}</div>
<div class="bg-white border border-linha rounded-xl overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-[13px] text-grafite">${E1.c.map(k => `<th class="px-4 py-3 font-semibold border-b border-linha whitespace-nowrap">${LB[k] || fl(col, k)[1] || k}</th>`).join('')}<th class="border-b border-linha"></th></tr></thead><tbody id="tb">${corpo(col)}</tbody></table></div>`;
};

const dash = () => {
  const f = F.d || (F.d = {});
  const sel = (k, c, l) => `<select data-f="${k}" aria-label="${l}" class="${IC}"><option value="">${l}</option>${Object.entries(D[c] || {}).map(([i, r]) => `<option value="${i}" ${f[k] === i ? 'selected' : ''}>${esc(LAB[c](r))}</option>`).join('')}</select>`;
  const ex = Object.values(D.expedicoes || {}).filter(e => {
    const d = new Date(e.dataHoraSaida).toLocaleDateString('sv');
    return (!f.de || d >= f.de) && (!f.ate || d <= f.ate) && (!f.m || e.idMotorista === f.m) && (!f.v || e.idVeiculo === f.v) && (!f.r || e.idRota === f.r) && (!f.s || e.statusExpedicao === f.s);
  });
  const vs = Object.values(D.veiculos || {}), cnt = s => vs.filter(v => v.status === s).length, ms = Object.values(D.motoristas || {});
  const cnhAl = ms.filter(m => m.status === 'Ativo' && m.validadeCnh && (new Date(m.validadeCnh) - Date.now()) / 864e5 <= 30).length;
  const gm = {}, gv = {}, gd = {}, gk = {};
  ex.forEach(e => {
    const d = new Date(e.dataHoraSaida).toLocaleDateString('pt-BR');
    gm[nm('motoristas', e.idMotorista)] = (gm[nm('motoristas', e.idMotorista)] || 0) + 1;
    gv[nm('veiculos', e.idVeiculo)] = (gv[nm('veiculos', e.idVeiculo)] || 0) + 1;
    gd[d] = (gd[d] || 0) + 1;
    gk[d] = (gk[d] || 0) + (e.kmRodado || 0);
  });
  const man = Object.values(D.manutencoes || {}), crit = Object.values(D.inspecoes || {}).filter(i => i.qtdCritico > 0).length;
  const box = (t, b) => `<section class="bg-white border border-linha rounded-xl p-5"><h3 class="text-[15px] font-semibold mb-4">${t}</h3>${b}</section>`;
  const kpi = (l, v, ic, tone = '') => `<div class="bg-white p-5"><div class="flex items-center gap-2 text-sm text-grafite font-medium"><span class="${tone || 'text-brand'}">${svg(ic, 'w-4 h-4')}</span>${l}</div><div class="font-display text-[34px] leading-none font-semibold tracking-tight mt-3 num ${tone}">${v}</div></div>`;
  /* abastecimento no período */
  const ab = Object.values(D.abastecimentos || {}).filter(a => (!f.de || a.data >= f.de) && (!f.ate || a.data <= f.ate) && (!f.v || a.idVeiculo === f.v) && (!f.m || a.idMotorista === f.m));
  const abL = ab.reduce((t, a) => t + Number(a.litros || 0), 0), abV = ab.reduce((t, a) => t + Number(a.valor || 0), 0);
  const litro = x => Number(x || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' L';
  const porV = {};
  ab.forEach(a => { const p = porV[a.idVeiculo] || (porV[a.idVeiculo] = { l: 0, v: 0, n: 0, odo: [] }); p.l += Number(a.litros || 0); p.v += Number(a.valor || 0); p.n++; if (temOdo(a)) p.odo.push([Number(a.odometro), Number(a.litros || 0)]); });
  let kmT = 0, lT = 0;
  const linhas = Object.entries(porV).map(([id, p]) => {
    let c = null;
    if (p.odo.length >= 2) {
      const os = p.odo.map(x => x[0]), km = Math.max(...os) - Math.min(...os), l = p.odo.reduce((t, x) => t + x[1], 0);
      if (l > 0) { c = km / l; kmT += km; lT += l; }
    }

/* MÉDIA DE CONSUMO (abastecimentos) */
let CR = null;
const consumoRel = () => {
  if (!CR) return;

  const txt = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
  const ks = E[col].c, h = ks.map(k => LB[k] || fl(col, k)[1] || k);
  const rows = re.map(([i, r]) => ks.map(k => txt(fmt(col, r, k, i))));
  const veic = nm('veiculos', f.idVeiculo);
  const per = f.de || f.ate ? `${f.de ? dt(f.de) : 'Início'} a ${f.ate ? dt(f.ate) : 'Hoje'}` : 'Todo o período';
  const kv = [['Média de consumo', lt > 0 ? n2(km / lt) + ' km/L' : '—'], ['KM percorridos', km.toLocaleString('pt-BR') + ' km'], ['Litros abastecidos', n2(lt) + ' L'], ['Custo por km', km > 0 ? 'R$ ' + n2(vl / km) : '—'], ['Valor total', 'R$ ' + n2(vl)], ['Abastecimentos', re.length], ['Odômetro inicial', Number(re[0][1].odometro).toLocaleString('pt-BR') + ' km'], ['Odômetro final', Number(re.at(-1)[1].odometro).toLocaleString('pt-BR') + ' km']];
  const top = [['Relatório de Média de Consumo'], ['Veículo', veic], ['Período', per], ['Cálculo', '(KM final - KM inicial) / total de litros'], ...kv];
  relShow('consumo', 'Relatório de Média de Consumo', `Veículo: ${esc(veic)} · Período: ${per} · Cálculo: (KM final − KM inicial) ÷ total de litros`, kv, h, rows, top);
};
const consumo = () => {
  CR = null;
  modal(`<h3 class="font-display text-2xl font-semibold tracking-tight mb-1">Média de consumo</h3><p class="text-sm text-gray-500 mb-4">(KM final registrado − KM inicial registrado) ÷ total de litros abastecidos no período.</p><form id="cf" class="grid sm:grid-cols-2 gap-3"><label class="text-sm sm:col-span-2"><span class="block mb-1.5 font-medium text-grafite">Veículo</span>${inp(['idVeiculo', 'Veículo', 'ref:veiculos'], '', { todos: 1 })}</label><label class="text-sm"><span class="block mb-1.5 font-medium text-grafite">Data inicial</span><input type="date" name="de" class="${IC}"></label><label class="text-sm"><span class="block mb-1.5 font-medium text-grafite">Data final</span><input type="date" name="ate" class="${IC}"></label><div id="cres" class="sm:col-span-2"></div><div class="sm:col-span-2 flex justify-end gap-2 pt-2"><button type="button" class="${G}" data-a="x">Fechar</button><button class="${B}">Calcular</button></div></form>`);
  $('#cf').onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (!f.idVeiculo) return toast('Selecione o veículo.', 0);
    if (f.de && f.ate && f.de > f.ate) return toast('A data inicial é depois da data final.', 0);
    const re = Object.entries(D.abastecimentos || {}).filter(([, a]) => a.idVeiculo === f.idVeiculo && temOdo(a) && (!f.de || a.data >= f.de) && (!f.ate || a.data <= f.ate)).sort((a, b) => Number(a[1].odometro) - Number(b[1].odometro)), rs = re.map(x => x[1]);
    if (rs.length < 2) {
      $('#cres').innerHTML = `<div class="p-3 rounded-xl bg-yellow-50 text-yellow-900 text-sm">São necessários pelo menos 2 abastecimentos com odômetro desse veículo no período para calcular a média.</div>`;
      return;
    }
    const km = Number(rs.at(-1).odometro) - Number(rs[0].odometro);
    const lt = rs.reduce((a, r) => a + Number(r.litros || 0), 0);
    const vl = rs.reduce((a, r) => a + Number(r.valor || 0), 0);
    const bx = (l, v) => `<div class="border border-gray-200 rounded-xl p-3"><div class="text-xs text-gray-500">${l}</div><div class="text-lg font-bold">${v}</div></div>`;
    $('#cres').innerHTML = `<div class="grid grid-cols-2 gap-2">${bx('Média de consumo', lt > 0 ? n2(km / lt) + ' km/L' : '—')}${bx('KM percorridos', km.toLocaleString('pt-BR') + ' km')}${bx('Litros abastecidos', n2(lt) + ' L')}${bx('Custo por km', km > 0 ? 'R$ ' + n2(vl / km) : '—')}</div><div class="flex justify-end mt-3"><button type="button" class="${B}" data-a="consrel">Baixar relatório (Excel / PDF)</button></div><p class="text-xs text-gray-400 mt-2">${rs.length} abastecimentos de ${esc(nm('veiculos', f.idVeiculo))}, de ${dt(rs[0].data)} (${Number(rs[0].odometro).toLocaleString('pt-BR')} km) a ${dt(rs.at(-1).data)} (${Number(rs.at(-1).odometro).toLocaleString('pt-BR')} km).</p>`;
    CR = { f, re, km, lt, vl };
  };
};

const relForm = col => {

  } else if (col === 'manutencoes') {
    extraFilters = `<label class="text-sm"><span class="block mb-1.5 font-medium text-grafite">Empresa</span><input name="empresa" class="${IC}"></label>`;

  $('#rf').onsubmit = e => {

    relatorio(col, Object.fromEntries(new FormData(e.target)));

};

const relatorio = (col, f) => {
  const txt = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
  let title = '', h = [], rowsData = [], kv = [];

  if (col === 'dashboard') {
    title = 'Relatório Geral Operacional';
    h = ['Módulo', 'Total de Registros', 'Resumo Operacional'];
    
    const exAll = Object.values(D.expedicoes || {}).filter(e => {
      const d = new Date(e.dataHoraSaida).toLocaleDateString('sv');
      return (!f.de || d >= f.de) && (!f.ate || d <= f.ate) && (!f.m || e.idMotorista === f.m) && (!f.v || e.idVeiculo === f.v) && (!f.r || e.idRota === f.r) && (!f.s || e.statusExpedicao === f.s);
    });

    const exN = exAll.length;
    const mnN = Object.keys(D.manutencoes || {}).length;
    const insN = Object.keys(D.inspecoes || {}).length;
    const absN = Object.keys(D.abastecimentos || {}).length;
    const veN = Object.keys(D.veiculos || {}).length;
    const moN = Object.keys(D.motoristas || {}).length;
    
    kv = [['Veículos Cadastrados', veN], ['Motoristas Ativos', Object.values(D.motoristas || {}).filter(m=>m.status==='Ativo').length], ['Expedições (Filtradas)', exN], ['Abastecimentos', absN]];
    rowsData = [
      ['Motoristas', moN, `${Object.values(D.motoristas||{}).filter(m=>m.status==='Ativo').length} ativos`],
      ['Veículos', veN, `${Object.values(D.veiculos||{}).filter(v=>v.status==='Disponível').length} disponíveis, ${Object.values(D.veiculos||{}).filter(v=>v.status==='Em uso').length} em uso`],
      ['Rotas', Object.keys(D.rotas||{}).length, 'Rotas operacionais ativas'],
      ['Expedições', exN, `${exAll.filter(e=>e.statusExpedicao==='Finalizada').length} finalizadas, KM total: ${exAll.reduce((a,e)=>a+(e.kmRodado||0),0)}`],
      ['Abastecimentos', absN, `Total gasto: R$ ${Object.values(D.abastecimentos||{}).reduce((a,b)=>a+Number(b.valor||0),0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`],
      ['Inspeções', insN, `${Object.values(D.inspecoes||{}).filter(i=>i.qtdCritico>0).length} com alertas críticos`],
      ['Manutenções', mnN, `Total gasto: R$ ${Object.values(D.manutencoes||{}).reduce((a,m)=>a+Number(m.valor||0),0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`]
    ];
  } else {
    title = `Relatório de ${E[col].t}`;
    const ks = E[col].c.filter(k => k !== 'checklist' && k !== 'fotoNota');
    h = ks.map(k => LB[k] || fl(col, k)[1] || k);
    
    const rawRows = Object.entries(D[col] || {}).filter(([i, r]) => {
      const d = r.data || r.dataHora || (r.dataHoraSaida ? new Date(r.dataHoraSaida).toLocaleDateString('sv') : '');
      return (!f.de || !d || d >= f.de) && (!f.ate || !d || d <= f.ate) && (!f.idVeiculo || r.idVeiculo === f.idVeiculo) && (!f.combustivel || r.combustivel === f.combustivel);
    });
    if (col === 'lojas') rawRows.sort(porNome);
    
    kv = [['Total de Registros', rawRows.length]];
    if (col === 'abastecimentos') {
      const totV = rawRows.reduce((a, [,r]) => a + Number(r.valor || 0), 0);
      const totL = rawRows.reduce((a, [,r]) => a + Number(r.litros || 0), 0);
      kv.push(['Valor Total', 'R$ ' + totV.toLocaleString('pt-BR', { minimumFractionDigits: 2 })]);

    }
    rowsData = rawRows.map(([i, r]) => ks.map(k => k === 'linkMaps' ? (r[k] || '—') : txt(fmt(col, r, k, i))));
  }

  relShow(col, title, f.de ? `Período: ${dt(f.de)} a ${f.ate ? dt(f.ate) : 'Hoje'}` : 'Listagem Geral Completa', kv, h, rowsData);
};

/* MANIPULADOR DE EVENTOS GLOBAL */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const { a, c, i } = b.dataset;

  if (a === 'rel') return relForm(c);
  if (a === 'consumo') return consumo();
  if (a === 'consrel') return consumoRel();
  if (a === 'pmov') {
    const n = +i, m = n + Number(c);
    if (m < 0 || m >= PERC.length) return;
    [PERC[n], PERC[m]] = [PERC[m], PERC[n]];
    $('#perc').innerHTML = percHtml();
    return;
  }
  if (a === 'rx') { $('#rel').classList.add('hidden'); document.body.classList.remove('pr'); return; }
  if (a === 'rprint') return window.print();
  if (a === 'rcsv') return csv();
  if (a === 'x') return modal();
  if (a === 'nav') { view = i; $('#side').classList.add('hidden'); return render(); }
  if (a === 'menu') return $('#side').classList.toggle('hidden');
  if (a === 'resetdb') {
    if (confirm("Deseja restaurar os dados fictícios originais da demonstração?")) {
      localStorage.removeItem('frotas_demo_db');
      D = loadDB();
      render();
      toast('Dados fictícios restaurados!');
    }
    return;
  }
  if (a === 'new') return c === 'expedicoes' ? novaExp() : form(c, null, E[c].f.map(f => f[0]), E[c].n);
  if (a === 'edit') return form(c, i, E[c].f.map(f => f[0]), 'Editar registro');
  if (a === 'det') return det(c, i);
  if (a === 'fim') return fim(i);
  if (a === 'chkexp') {
    const el = $(`#chk_${i}`);
    if (el) el.classList.toggle('hidden');
    return;
  }
  if (a === 'verfoto') {
    const m = D.manutencoes[i];
    modal(`<h3 class="font-display text-2xl font-semibold tracking-tight mb-4">Comprovante de Nota Fiscal</h3><div class="mb-4 overflow-auto max-h-[70vh] flex justify-center">${m.fotoNota ? `<img src="${m.fotoNota}" class="max-w-full rounded shadow">` : '<p class="text-gray-400">Sem imagem anexada.</p>'}</div><div class="flex justify-end"><button class="${B}" data-a="x">Fechar</button></div>`);
    return;
  }
  if (a === 'del') {
    const r = D[c][i];
    return conf('Tem certeza de que deseja excluir este registro? Esta ação não poderá ser desfeita.', () => {
      delete D[c][i];
      if (c === 'expedicoes' || c === 'manutencoes') recalc(r.idVeiculo);
      saveDB();
    }, 'Registro excluído.');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'lq') {
    const q = norm(e.target.value.trim());
    let n = 0;
    document.querySelectorAll('#lojasBox [data-n]').forEach(l => { const ok = l.dataset.n.includes(q); l.classList.toggle('hidden', !ok); n += ok; });
    $('#lojasVazio').classList.toggle('hidden', n > 0);
    return;
  }
  if (e.target.id === 'q' || e.target.id === 's') {
    const col = MENU.find(m => m[0] === view)[1];
    F[col + e.target.id] = e.target.value;
    $('#tb').innerHTML = corpo(col);
  }
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'lq' && e.key === 'Enter') e.preventDefault();
});

document.addEventListener('change', e => {
  if (e.target.hasAttribute('data-perc')) {
    const id = e.target.value;
    PERC = e.target.checked ? [...PERC.filter(x => x !== id), id] : PERC.filter(x => x !== id);
    $('#perc').innerHTML = percHtml();
    return;
  }
  const k = e.target.dataset.f;
  if (k) { F.d[k] = e.target.value; render(); }
});

/* ESTRUTURA E RENDERIZAÇÃO */
const render = () => {
  if (!$('#main')) return;
  const nv = $('#nav');
  if (nv) nv.innerHTML = navHtml();
  const col = (MENU.find(m => m[0] === view) || [])[1];
  $('#main').innerHTML = view === 'Dashboard' ? dash() : lista(col);
};

const navHtml = () => MENU.map(([l, , i]) => `<a href="#" data-a="nav" data-i="${l}" ${l === view ? 'aria-current="page"' : ''} class="relative flex items-center gap-3 pl-5 pr-3 py-2.5 rounded-lg text-[15px] font-medium transition-colors ${l === view ? 'bg-white/[0.07] text-white' : 'text-gray-400 hover:text-white hover:bg-white/[0.04]'}">${l === view ? '<span class="absolute left-0 top-2 bottom-2 w-[3px] rounded-r bg-brand"></span>' : ''}<span class="${l === view ? 'text-brand' : ''}">${svg(i, 'w-[18px] h-[18px]')}</span>${l}</a>`).join('');

const shell = () => {
  $('#app').innerHTML = `<div class="md:flex min-h-screen">
    <div class="md:hidden bg-ink text-white px-4 py-3 flex justify-between items-center sticky top-0 z-30">
      ${marca(1)}
      <button data-a="menu" class="p-2 rounded-lg hover:bg-white/10" aria-label="Abrir menu">${svg('menu')}</button>
    </div>
    <aside id="side" class="hidden md:flex flex-col w-full md:w-[260px] shrink-0 bg-ink md:sticky md:top-0 md:h-screen">
      <div class="hidden md:block px-5 pt-6 pb-5">${marca(1)}</div>
      <nav id="nav" class="flex-1 px-3 py-2 space-y-0.5 overflow-y-auto">${navHtml()}</nav>
      <div class="p-4 border-t border-white/10">
        <div class="flex items-center gap-3 mb-3">
          <span class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center font-semibold">D</span>
          <div class="leading-tight min-w-0">
            <div class="font-medium text-white truncate">Modo demonstração</div>
            <div class="text-[13px] text-gray-400">Dados fictícios, salvos só neste navegador</div>
          </div>
        </div>
        <button data-a="resetdb" class="w-full rounded-lg border border-white/15 text-gray-200 px-4 py-2 text-sm font-medium hover:bg-white/5 transition-colors">Restaurar dados de exemplo</button>
      </div>
    </aside>
    <main id="main" class="flex-1 px-4 py-6 md:px-10 md:py-9 min-w-0 max-w-[1440px]"></main>
  </div>`;
  render();
};

/* INICIALIZAÇÃO DIRETA */
shell();
</script>
</body>
</html>
